services:
  - type: web
    name: schudme-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm run render-build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schudme-db
          property: connectionString
      - key: PORT
        value: 4000

databases:
  - name: schudme-db
    plan: free
    databaseName: schudme
    user: schudme
