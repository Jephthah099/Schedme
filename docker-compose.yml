services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedme
      POSTGRES_PASSWORD: schedme
      POSTGRES_DB: schedme
    ports:
      - "5432:5432"
    volumes:
      - schedme_pgdata:/var/lib/postgresql/data

volumes:
  schedme_pgdata:
